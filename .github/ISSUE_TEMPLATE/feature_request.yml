name: Feature request
description: Something Jonquil could do that it doesn't yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or workflow, in your own words. What makes it awkward today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A sketch of the keys, menu or panel is welcome, and so is "like X in Emacs, Cursive or DrRacket".
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
