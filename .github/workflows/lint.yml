name: Lint

# Runs on every push to main and on every pull request, and by hand from
# the Actions tab (or `gh workflow run lint.yml`).
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bb too: clojure-lsp sees bb.edn and runs `bb print-deps` to find the
      # classpath, and the format check fails without it.
      - name: Set up the Clojure CLI, clj-kondo and babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          clj-kondo: latest
          bb: latest

      # setup-clojure has no clojure-lsp input (it warns and installs
      # nothing), so clojure-lsp comes from its own action, pinned to the
      # version the format check was last run with locally.
      - name: Set up clojure-lsp
        uses: clojure-lsp/setup-clojure-lsp@v1.0.3
        with:
          clojure-lsp-version: 2026.10.15-11.42.38

      # jolt runs the tasks (it reads bb.edn). clj-kondo lints source text
      # with its own analysis, and clojure-lsp's format check reformats
      # source text with cljfmt/rewrite-clj, so neither needs more than that.
      - name: Install jolt
        uses: jlt-commons/setup-jolt@v1

      - name: clj-kondo lint (jolt lint:strict)
        run: jolt lint:strict

      - name: clojure-lsp format check (jolt lsp:format-check)
        run: jolt lsp:format-check

  # jolt metrics:gate: a critical jolt-metrics finding under src/ or test/, or
  # unused code ci/metrics-allow.edn doesn't list, fails the run.
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # churn and hotspots come from the git history
          fetch-depth: 0

      - name: Install jolt
        uses: jlt-commons/setup-jolt@v1
        with:
          version: "0.8.27"

      - name: jolt metrics:gate
        run: jolt metrics:gate

      - name: The report
        if: always()
        run: |
          jolt metrics target/metrics-report.md --top 30 >/dev/null
          awk '/^## Cleanup candidates/{exit} {print}' target/metrics-report.md >> "$GITHUB_STEP_SUMMARY"
