name: attribution

# Commit messages and pull request descriptions carry no AI assistant
# attribution (ci/attributioncheck.sh lists what counts; AI_POLICY.md says how
# the project stands on AI assistance). Runs on a push to main, on every pull
# request and by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    name: No AI attribution in commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commits in range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # a new branch, a force-push or a manual run: the recent commits
            range="HEAD~20..HEAD"
          fi
          sh ci/attributioncheck.sh "$range"
      - name: pull request description
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$BODY" | sh ci/attributioncheck.sh --text
