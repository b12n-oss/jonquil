<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Jonquil</title>
  <!-- A jonquil seen from the front. The flower has two whorls
       of three tepals (the back three a shade deeper), and a short frilled cup. -->
  <defs>
    <path id="tepal" d="M64 63 C54 55 51.5 39 57.5 29 C60 25 62.5 23 64 21.5 C65.5 23 68 25 70.5 29 C76.5 39 74 55 64 63 Z"/>
    <path id="rib" d="M64 58 L64 31"/>
  </defs>

  <!-- scaled up from the 64,64 centre so the flower fills the frame -->
  <g transform="translate(64 64) scale(1.4) translate(-64 -64)">
  <!-- back whorl -->
  <g fill="#F5C518" stroke="#D99A00" stroke-width="1.2" stroke-linejoin="round">
    <use href="#tepal" transform="rotate(60 64 64)"/>
    <use href="#tepal" transform="rotate(180 64 64)"/>
    <use href="#tepal" transform="rotate(300 64 64)"/>
  </g>
  <!-- front whorl -->
  <g fill="#FFDD4A" stroke="#D99A00" stroke-width="1.2" stroke-linejoin="round">
    <use href="#tepal" transform="rotate(0 64 64)"/>
    <use href="#tepal" transform="rotate(120 64 64)"/>
    <use href="#tepal" transform="rotate(240 64 64)"/>
  </g>
  <!-- faint midribs on every tepal -->
  <g stroke="#E0A800" stroke-width="1" stroke-linecap="round" opacity="0.55">
    <use href="#rib" transform="rotate(60 64 64)"/>
    <use href="#rib" transform="rotate(180 64 64)"/>
    <use href="#rib" transform="rotate(300 64 64)"/>
    <use href="#rib" transform="rotate(0 64 64)"/>
    <use href="#rib" transform="rotate(120 64 64)"/>
    <use href="#rib" transform="rotate(240 64 64)"/>
  </g>

  <!-- the cup: a frilled rim, a deeper throat, and three stamens -->
  <g transform="translate(64 64)">
    <path fill="#FFA41B" stroke="#D9480F" stroke-width="1.4" stroke-linejoin="round"
          d="M0 -12.5 Q3.4 -14.6 5.6 -11.8 Q9.4 -11.6 9.8 -7.9 Q13.4 -6.3 12.1 -2.6 Q14.2 0.9 11.3 3.5 Q11.5 7.4 7.8 8.8 Q6.3 12.6 2.5 12.2 Q-0.6 14.8 -3.6 12.1 Q-7.5 12.6 -8.8 8.9 Q-12.6 7.6 -11.9 3.7 Q-14.6 1 -12.3 -2.3 Q-13.3 -6.2 -9.8 -8 Q-9.2 -11.8 -5.5 -11.9 Q-3.2 -14.7 0 -12.5 Z"/>
    <circle r="7.6" fill="#F76707"/>
    <circle r="4.6" fill="#D9480F"/>
    <g fill="#FFE066">
      <circle cx="0" cy="-2.2" r="1.35"/>
      <circle cx="1.9" cy="1.1" r="1.35"/>
      <circle cx="-1.9" cy="1.1" r="1.35"/>
    </g>
  </g>
  </g>
</svg>
