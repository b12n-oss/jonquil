<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Jonquil</title>
  <!-- A jonquil (six petals, short cup) between a pair of Lisp parentheses. -->
  <defs>
    <path id="petal" d="M64 62 C51 53 50 33 64 22 C78 33 77 53 64 62 Z"/>
  </defs>
  <!-- parentheses, in stem green -->
  <g fill="none" stroke="#2F9E5A" stroke-width="7" stroke-linecap="round">
    <path d="M26 16 C8 40 8 88 26 112"/>
    <path d="M102 16 C120 40 120 88 102 112"/>
  </g>
  <!-- petals -->
  <g fill="#FFD43B" stroke="#E0A400" stroke-width="1.5" stroke-linejoin="round">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(60 64 64)"/>
    <use href="#petal" transform="rotate(120 64 64)"/>
    <use href="#petal" transform="rotate(180 64 64)"/>
    <use href="#petal" transform="rotate(240 64 64)"/>
    <use href="#petal" transform="rotate(300 64 64)"/>
  </g>
  <!-- the short cup (corona), with a scalloped rim -->
  <g transform="translate(64 64)">
    <path fill="#F59F00" stroke="#D9480F" stroke-width="1.5" stroke-linejoin="round"
          d="M0 -13 Q4.5 -14 6.5 -11.3 Q10.4 -10.5 11.3 -6.5 Q14 -4.5 13 0 Q14 4.5 11.3 6.5 Q10.4 10.5 6.5 11.3 Q4.5 14 0 13 Q-4.5 14 -6.5 11.3 Q-10.4 10.5 -11.3 6.5 Q-14 4.5 -13 0 Q-14 -4.5 -11.3 -6.5 Q-10.4 -10.5 -6.5 -11.3 Q-4.5 -14 0 -13 Z"/>
    <circle r="6.5" fill="#E8590C"/>
    <circle r="2.6" fill="#FFD43B"/>
  </g>
</svg>
